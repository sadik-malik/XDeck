name: Release

# Run by hand only (Actions → Release → Run workflow), with a version such as "1.0". It builds the
# Electron app for macOS, Windows and Linux from the chosen branch and publishes one GitHub Release
# with all of them, creating the version's tag on the commit it built. The version must stay
# "MAJOR.MINOR" with no "v" prefix. It is referenced as-is by the Homebrew Cask formula
# (releases/download/#{version}/XDeck-#{version}.zip, a zip containing XDeck.app) and by the in-app
# update check (src/main/view.ts), which reads /tag/([0-9]+\.[0-9]+) from where releases/latest
# redirects.
# Actions are pinned to the commit of a release (Node 24 actions, 2026-10-12), so a moved tag cannot
# change what runs in this workflow (TASK-036).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, MAJOR.MINOR with no "v" (e.g. 1.0). It becomes the release tag.'
        required: true
        type: string

# The version reaches the steps through env only, never pasted into a script, and is checked first.
env:
  VERSION: ${{ inputs.version }}

# Read-only by default; only the publish job, which holds no signing secrets, may write (TASK-036).
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux

    steps:
      - name: Check the version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "The version must be MAJOR.MINOR, like 1.0 (no v): got '$VERSION'" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder needs semver, so version X.Y becomes X.Y.0. The in-app update check
      # compares X.Y only.
      - name: Set the version
        shell: bash
        run: npm pkg set version="${VERSION}.0"

      - name: Build
        run: pnpm build

      # macOS: ad-hoc signed, not notarized (electron-builder.yml: no Apple Developer account, so no
      # secrets). The zip is XDeck-<version>.zip containing XDeck.app.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: >-
          pnpm exec electron-builder --mac --publish never
          -c.mac.artifactName="XDeck-${VERSION}.\${ext}"

      # Windows: unsigned for now (SmartScreen warns on first install).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          pnpm exec electron-builder --win --publish never
          -c.win.artifactName="XDeck-Setup-${VERSION}.\${ext}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: >-
          pnpm exec electron-builder --linux --publish never
          -c.linux.artifactName="XDeck-${VERSION}-\${arch}.\${ext}"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release with the default GITHUB_TOKEN
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Check the Homebrew asset
        run: test -f "packages/XDeck-${VERSION}.zip"

      # The tag is created on the commit the packages were built from.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$VERSION" packages/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$VERSION"
          --generate-notes
